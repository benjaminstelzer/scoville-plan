[package]
name = "scoville-plan-viewer"
version = "1.3.1"
description = "A local read-only viewer for Scoville Plan projects"
authors = ["Benjamin Stelzer"]
edition = "2021"

[lib]
name = "scoville_plan_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atomicwrites = "0.4"
quick-xml = { version = "0.38", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
